name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: Tests (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: ${{ matrix.php }}
          ini-values: xdebug.max_nesting_level=3000
          extensions: sockets, openssl, encoding-pmmp/ext-encoding@1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Composer package cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/composer"
          key: "php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-composer-"

      # ext-webrtc is a source-built extension with a libdatachannel dependency, and
      # nothing under analysis or test needs it at runtime: PHPStan reads the stubs in
      # stubs/ and the tests drive the transport through fakes. Installing it here would
      # cost a C++ build for no coverage.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --ignore-platform-req=ext-webrtc

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

      # phpunit.xml.dist already turns warnings and risky tests into failures
      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit

  codestyle:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    name: Code Style checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: 8.1
          ini-values: xdebug.max_nesting_level=3000
          tools: php-cs-fixer:3.95
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --ansi
